[project]
name = "instruction-set-eval"
version = "0.1.0"
description = "Two-tier evaluation for agent instruction sets"
requires-python = ">=3.10"
dependencies = [
    # Tier 1 group A token counting (interim backend — see evalkit/tokens.py).
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# Needed only once the Anthropic token backend and the LLM judge land (Phase 3+).
llm = [
    "anthropic>=0.69",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]
